[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeintel"
version = "0.1.0"
description = "PRISM Theme 01: code retrieval on MTEB AppsRetrieval with execution-verified reranking"
requires-python = ">=3.11,<3.12"
dependencies = [
    "mteb>=2.2.0",
    "sentence-transformers",
    "transformers>=4.48",
    "torch",
    "datasets",
    "numpy",
    "pyyaml",
    "pywin32; sys_platform == 'win32'",
    "psutil",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
